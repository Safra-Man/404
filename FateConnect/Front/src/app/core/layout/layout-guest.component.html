<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #drawer mode="over" position="end" class="sidenav">
    <div class="logo-container">
      <a class="logo-app" routerLink="/inicio">
        <app-typography variant="logo">FateConnect</app-typography>
      </a>
    </div>

    <mat-nav-list>
      <button type="button" mat-list-item (click)="closeDrawerAndGoToFragment(drawer, 'servicos')">Serviços</button>
      <button type="button" mat-list-item (click)="closeDrawerAndGoToFragment(drawer, 'como-funciona')">Como Funciona</button>
      <button type="button" mat-list-item (click)="closeDrawerAndGoToFragment(drawer, 'contato')">Entre em Contato</button>
      <button type="button" mat-list-item (click)="closeDrawerAndGoToFragment(drawer, 'login')">Entrar</button>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <main class="layout">
      <app-header [drawer]="drawer" [isLoggedIn]="false"></app-header>

      <div class="layout-main">
        <router-outlet></router-outlet>
      </div>

      <app-footer></app-footer>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
