<div class="offer-wrapper">
  <div class="offer-card">
    <app-typography variant="h2">Ofertar Nova Carona</app-typography>
    <app-typography variant="subtitle">
      Compartilhe uma carona com outros estudantes da Fatec Sorocaba
    </app-typography>

    <button class="btn-offer" type="button" (click)="onOfferClick()">
      <fa-icon [icon]="addIcon"></fa-icon>
      <app-typography variant="subtitle-bold">Ofertar Carona</app-typography>
    </button>
  </div>
</div>
